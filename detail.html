
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チェックリスト詳細</title>
  <style>
    body {
      font-family: sans-serif;
      font-size: 1.1em;
      padding: 1em;
      background-color: #f9f9f9;
    }
    h1 {
      font-size: 1.4em;
      margin-bottom: 1em;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin: 0.7em 0;
    }
    label {
      display: flex;
      align-items: center;
      background: #fff;
      padding: 0.8em;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }
    input[type="checkbox"] {
      transform: scale(1.4);
      margin-right: 1em;
    }
  </style>
  <script src="checklist.js"></script>
</head>
<body>
  <h1 id="title">チェックリスト</h1>
  <ul id="checklist"></ul>
</body>
</html>
